# 想在群晖本地构建时用：docker compose -f docker-compose.build.yml up -d --build
# 国内网络加： --build-arg USE_CN_MIRROR=1 （或取消下面 args 的注释）
services:
  douyin-wm-downloader:
    build:
      context: .
      # args:
      #   USE_CN_MIRROR: "1"
    image: douyin-wm-downloader:latest
    container_name: douyin-wm-downloader
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - ./data:/data
    environment:
      - TZ=Asia/Shanghai
      # ===== 登录（强烈建议开启；两项都填才生效，改密码后需 docker compose up -d）=====
      # 密码里如果有 $ 符号，要写成 $$
      - AUTH_USER=admin
      - AUTH_PASS=请改成你自己的强密码
